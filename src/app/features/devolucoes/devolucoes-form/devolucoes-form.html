
<section class="form-container">

  <div class="form-cabecalho">
    <h2>Registrar Devolução</h2>
    <p>Selecione o empréstimo e informe os dados da devolução.</p>
  </div>

  <form #form="ngForm" (ngSubmit)="salvar()">

    <div class="campo">
      <label for="emprestimoId">Empréstimo *</label>

      <select
        id="emprestimoId"
        name="emprestimoId"
        [(ngModel)]="emprestimoId"
        required
      >
        <option value="" disabled>
          Selecione um empréstimo
        </option>

        @for (emprestimo of emprestimosDisponiveis; track emprestimo._id) {
          <option [value]="emprestimo._id">
            {{ emprestimo.tituloLivro }} — {{ emprestimo.nomeUsuario }}
            ({{ emprestimo._id }})
          </option>
        }
      </select>

      @if (emprestimosDisponiveis.length === 0) {
        <small class="aviso">
          Não existem empréstimos disponíveis para devolução.
        </small>
      }
    </div>

    <div class="campo">
      <label for="dataDevolucao">Data da devolução *</label>

      <input
        id="dataDevolucao"
        name="dataDevolucao"
        type="date"
        [(ngModel)]="dataDevolucao"
        required
      />
    </div>

    <div class="campo">
      <label for="observacao">Observação</label>

      <textarea
        id="observacao"
        name="observacao"
        [(ngModel)]="observacao"
        placeholder="Ex.: Livro devolvido em bom estado"
        rows="4"
      ></textarea>
    </div>

    @if (erro) {
      <p class="erro">{{ erro }}</p>
    }

    <div class="acoes">
      <a routerLink="/devolucoes" class="botao-cancelar">
        Cancelar
      </a>

      <button
        type="submit"
        [disabled]="emprestimosDisponiveis.length === 0"
      >
        Registrar devolução
      </button>
    </div>

  </form>
</section>
