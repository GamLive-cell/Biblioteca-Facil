
<section class="form-container">
  <h1>Novo usuário</h1>
  <p>Preencha os dados para cadastrar um usuário na biblioteca.</p>

  <form (ngSubmit)="salvar()">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" type="text"
      [(ngModel)]="nome" required
      placeholder="Digite o nome completo" />

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email"
      [(ngModel)]="email" required
      placeholder="exemplo@email.com" />

    <label for="perfil">Perfil</label>
    <select id="perfil" name="perfil" [(ngModel)]="perfil" required>
      <option value="Leitor">Leitor</option>
      <option value="Bibliotecária">Bibliotecária</option>
      <option value="Administrador">Administrador</option>
    </select>

    @if (erro) {
      <p class="mensagem-erro">{{ erro }}</p>
    }

    <div class="acoes">
      <button type="submit">Cadastrar usuário</button>
    </div>
  </form>
</section>
